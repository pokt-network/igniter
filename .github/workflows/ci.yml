name: CI

on:
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "k8s/apps/**/overlays/**"

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  branch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Only release branch can target main
        if: github.base_ref == 'main' && github.head_ref != 'release'
        run: |
          echo "::error::PRs to main must come from the 'release' branch, not '${{ github.head_ref }}'."
          echo "Flow: feature → staging → release → main"
          exit 1
      - name: Gate passed
        run: echo "OK"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 18.20.3

      - run: pnpm install --frozen-lockfile

      - name: Format check
        continue-on-error: true
        run: pnpm prettier --check "**/*.{ts,tsx}"

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Type check
        continue-on-error: true
        run: pnpm turbo check-types

      - name: Test
        run: pnpm turbo test

  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [middleman, middleman-workflows, provider, provider-workflows]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 18.20.3

      - run: pnpm install --frozen-lockfile

      - name: Prepare docker context
        run: pnpm exec turbo prune @igniter/${{ matrix.app }} --out-dir ./out/${{ matrix.app }} --docker

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
