name: CI

on:
  pull_request:
    branches: ["*"]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  branch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Only release branch can target main
        if: github.base_ref == 'main' && github.head_ref != 'release'
        # The branch name is chosen by the PR author (any fork can pick it), so it
        # reaches the shell through env, never through ${{ }} interpolation.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::PRs to main must come from the 'release' branch, not '${HEAD_REF}'."
          echo "Flow: feature → staging → release → main"
          exit 1
      - name: Gate passed
        run: echo "OK"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Format check
        continue-on-error: true
        run: pnpm prettier --check "**/*.{ts,tsx}"

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Type check
        continue-on-error: true
        run: pnpm turbo check-types

      - name: Test
        run: pnpm turbo test

      - name: No-console guard
        run: bash scripts/no-console-guard.sh

  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [middleman, middleman-workflows, provider, provider-workflows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Prepare docker context
        run: pnpm exec turbo prune @igniter/${{ matrix.app }} --out-dir ./out/${{ matrix.app }} --docker

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: false
          # PR builds get their own cache scope: a PR (forks included) must not
          # be able to write layers that the staging/production deploy builds
          # (scope=<app>) then read back.
          cache-from: type=gha,scope=pr-${{ matrix.app }}
          cache-to: type=gha,scope=pr-${{ matrix.app }},mode=max,ignore-error=true
