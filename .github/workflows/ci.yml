name: CI

on:
  pull_request:
    branches: ["*"]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  branch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Only release branch can target main
        if: github.base_ref == 'main' && github.head_ref != 'release'
        # The branch name is chosen by the PR author (any fork can pick it), so it
        # reaches the shell through env, never through ${{ }} interpolation.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::PRs to main must come from the 'release' branch, not '${HEAD_REF}'."
          echo "Flow: feature → staging → release → main"
          exit 1
      - name: Gate passed
        run: echo "OK"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Format check
        continue-on-error: true
        run: pnpm prettier --check "**/*.{ts,tsx}"

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Type check
        continue-on-error: true
        run: pnpm turbo check-types

      - name: Test
        run: pnpm turbo test

      - name: No-console guard
        run: bash scripts/no-console-guard.sh

  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [middleman, middleman-workflows, provider, provider-workflows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Prepare docker context
        run: pnpm exec turbo prune @igniter/${{ matrix.app }} --out-dir ./out/${{ matrix.app }} --docker

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: false
          # PR builds get their own cache scope: a PR (forks included) must not
          # be able to write layers that the staging/production deploy builds
          # (scope=<app>) then read back.
          cache-from: type=gha,scope=pr-${{ matrix.app }}
          cache-to: type=gha,scope=pr-${{ matrix.app }},mode=max,ignore-error=true
