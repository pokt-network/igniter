name: Deploy Production

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (only for manual trigger)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 18.20.3

      - run: pnpm install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: compute version from latest tag + input
            LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
            if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            case "${{ inputs.bump_type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

            # Update overlays since prepare-release didn't run
            sed -i 's/newTag: ".*"/newTag: "'"$NEW_VERSION"'"/' k8s/apps/middleman/overlays/mainnet/kustomization.yaml
            sed -i 's/newTag: ".*"/newTag: "'"$NEW_VERSION"'"/' k8s/apps/middleman-workflows/overlays/mainnet/kustomization.yaml
          else
            # PR merge: version already set by prepare-release workflow
            NEW_VERSION=$(grep 'newTag:' k8s/apps/middleman/overlays/mainnet/kustomization.yaml | head -1 | sed 's/.*newTag: "\(.*\)"/\1/')
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Deploying version: v$NEW_VERSION"

      - name: Prune all apps
        run: |
          for APP in middleman middleman-workflows provider provider-workflows; do
            pnpm exec turbo prune @igniter/$APP --out-dir ./out/$APP --docker
          done

      - name: Build and push middleman
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/middleman/Dockerfile
          push: true
          tags: |
            ghcr.io/pokt-network/middleman:${{ env.NEW_VERSION }}
            ghcr.io/pokt-network/middleman:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push middleman-workflows
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/middleman-workflows/Dockerfile
          push: true
          tags: |
            ghcr.io/pokt-network/middleman-workflows:${{ env.NEW_VERSION }}
            ghcr.io/pokt-network/middleman-workflows:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push provider
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/provider/Dockerfile
          push: true
          tags: |
            ghcr.io/pokt-network/provider:${{ env.NEW_VERSION }}
            ghcr.io/pokt-network/provider:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push provider-workflows
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/provider-workflows/Dockerfile
          push: true
          tags: |
            ghcr.io/pokt-network/provider-workflows:${{ env.NEW_VERSION }}
            ghcr.io/pokt-network/provider-workflows:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit overlay changes and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only needed for workflow_dispatch (PR merge already has overlays updated)
          git add k8s/apps/middleman/overlays/mainnet/kustomization.yaml \
                  k8s/apps/middleman-workflows/overlays/mainnet/kustomization.yaml
          if ! git diff --staged --quiet; then
            git commit -m "chore(deploy): release v${NEW_VERSION} [skip ci]"
          fi

          git tag "v${NEW_VERSION}"
          git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | sed -n '2p')

          DOCKER_IMAGES="## Docker Images

          **Provider Application:**
          - Provider: \`ghcr.io/pokt-network/provider:${NEW_VERSION}\`
          - Provider Workflows: \`ghcr.io/pokt-network/provider-workflows:${NEW_VERSION}\`

          **Delegator (Middleman) Application:**
          - Middleman: \`ghcr.io/pokt-network/middleman:${NEW_VERSION}\`
          - Middleman Workflows: \`ghcr.io/pokt-network/middleman-workflows:${NEW_VERSION}\`"

          if [ -n "$PREV_TAG" ]; then
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION}" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              --latest
          else
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION}" \
              --generate-notes \
              --latest
          fi

          EXISTING_BODY=$(gh release view "v${NEW_VERSION}" --json body --jq '.body')
          gh release edit "v${NEW_VERSION}" \
            --notes "${EXISTING_BODY}

          ${DOCKER_IMAGES}"

      - name: Rebase staging on main
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin staging >/dev/null 2>&1; then
            git fetch origin staging
            git checkout staging
            git rebase origin/main
            git push --force-with-lease origin staging
            echo "Staging rebased on main"
          else
            echo "Staging branch not found, skipping rebase"
          fi
