name: Deploy Production

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [middleman, middleman-workflows, provider, provider-workflows]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 18.20.3

      - run: pnpm install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          NEW_VERSION=$(grep 'newTag:' k8s/apps/middleman/overlays/mainnet/kustomization.yaml | head -1 | sed 's/.*newTag: "\(.*\)"/\1/')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: v$NEW_VERSION"

      - name: Prepare docker context
        run: pnpm exec turbo prune @igniter/${{ matrix.app }} --out-dir ./out/${{ matrix.app }} --docker

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/pokt-network/${{ matrix.app }}:${{ env.NEW_VERSION }}
            ghcr.io/pokt-network/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  release:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        run: echo "NEW_VERSION=${{ needs.build-push.outputs.version }}" >> $GITHUB_ENV

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | sed -n '2p')

          DOCKER_IMAGES="## Docker Images

          **Provider Application:**
          - Provider: \`ghcr.io/pokt-network/provider:${NEW_VERSION}\`
          - Provider Workflows: \`ghcr.io/pokt-network/provider-workflows:${NEW_VERSION}\`

          **Delegator (Middleman) Application:**
          - Middleman: \`ghcr.io/pokt-network/middleman:${NEW_VERSION}\`
          - Middleman Workflows: \`ghcr.io/pokt-network/middleman-workflows:${NEW_VERSION}\`"

          if [ -n "$PREV_TAG" ]; then
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION}" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              --latest
          else
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION}" \
              --generate-notes \
              --latest
          fi

          EXISTING_BODY=$(gh release view "v${NEW_VERSION}" --json body --jq '.body')
          gh release edit "v${NEW_VERSION}" \
            --notes "${EXISTING_BODY}

          ${DOCKER_IMAGES}"

      - name: Sync staging with main
        run: git push origin main:staging --force
