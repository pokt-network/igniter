name: Deploy Production

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump for manual runs (PR-merge runs use the release:* label instead)'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    # A manual run must come from main: workflow_dispatch can target any
    # branch, and this job pushes release tags + `latest` and cuts a release.
    # The PR-merged path is not checked against github.ref, because there it is
    # refs/pull/N/merge; that path is already restricted to PRs merged into main.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [middleman, middleman-workflows, provider, provider-workflows]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }} || [ "${{ github.event.inputs.release_type }}" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }} || [ "${{ github.event.inputs.release_type }}" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: v$NEW_VERSION"

      - name: Prepare docker context
        run: pnpm exec turbo prune @igniter/${{ matrix.app }} --out-dir ./out/${{ matrix.app }} --docker

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/pokt-network/${{ matrix.app }}:${{ env.NEW_VERSION }}
            ghcr.io/pokt-network/${{ matrix.app }}:latest
          build-args: |
            APP_VERSION=${{ env.NEW_VERSION }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max,ignore-error=true

  release:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        run: echo "NEW_VERSION=${{ needs.build-push.outputs.version }}" >> $GITHUB_ENV

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | sed -n '2p')

          # Build changelog from PRs merged to staging since last release
          if [ -n "$PREV_TAG" ]; then
            PREV_TAG_DATE=$(git log -1 --format=%aI "$PREV_TAG" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG_DATE" ]; then
              CHANGELOG=$(gh pr list --base staging --state merged --search "merged:>=$PREV_TAG_DATE" \
                --json number,title --jq '.[] | "- \(.title) (#\(.number))"' 2>/dev/null || echo "")
            fi

            # Fallback to git log if no PRs found
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG=$(git log "${PREV_TAG}..v${NEW_VERSION}" --oneline --no-merges --pretty=format:"- %s" \
                | grep -v "^- chore(deploy):" \
                | grep -v "^- chore(release):" \
                | grep -v "^- Release v" \
                || echo "- No changes")
            fi

            COMPARE="**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${NEW_VERSION}"
          else
            CHANGELOG="- Initial release"
            COMPARE=""
          fi

          RELEASE_NOTES="## What's Changed

          ${CHANGELOG}

          ${COMPARE}

          ## Docker Images

          **Provider Application:**
          - Provider: \`ghcr.io/pokt-network/provider:${NEW_VERSION}\`
          - Provider Workflows: \`ghcr.io/pokt-network/provider-workflows:${NEW_VERSION}\`

          **Delegator (Middleman) Application:**
          - Middleman: \`ghcr.io/pokt-network/middleman:${NEW_VERSION}\`
          - Middleman Workflows: \`ghcr.io/pokt-network/middleman-workflows:${NEW_VERSION}\`"

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Sync staging with main
        run: git push origin main:staging --force
