name: Deploy Staging

on:
  pull_request:
    types: [closed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-push:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [middleman, middleman-workflows, provider, provider-workflows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 18.20.3

      - run: pnpm install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Prepare docker context
        run: pnpm exec turbo prune @igniter/${{ matrix.app }} --out-dir ./out/${{ matrix.app }} --docker

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/pokt-network/${{ matrix.app }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  post-deploy:
    needs: build-push
    runs-on: ubuntu-latest
    concurrency:
      group: release-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update staging overlay
        run: |
          sed -i 's/newTag: ".*"/newTag: "'"$IMAGE_TAG"'"/' k8s/apps/middleman/overlays/staging/kustomization.yaml

      - name: Commit and push overlay changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/middleman/overlays/staging/kustomization.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(deploy): update staging image to $IMAGE_TAG"
          git push

      - name: Create or update release branch
        run: |
          git fetch origin

          if git ls-remote --heads origin release | grep -q release; then
            # Release branch exists — merge staging into it to preserve
            # any commits from prepare-release (mainnet overlay bumps)
            git checkout -b release origin/release
            git merge staging --no-edit -m "chore: merge staging ($IMAGE_TAG) into release"
            git push origin release
          else
            # First deploy: create release branch from staging
            git checkout -B release
            git push origin release
          fi

      - name: Create or update release PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base main --head release --json number --jq '.[0].number' 2>/dev/null || echo "")

          # Build changelog from PRs merged to staging since last release tag
          PREV_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          PREV_TAG_DATE=""
          if [ -n "$PREV_TAG" ]; then
            PREV_TAG_DATE=$(git log -1 --format=%aI "$PREV_TAG" 2>/dev/null || echo "")
          fi

          if [ -n "$PREV_TAG_DATE" ]; then
            CHANGELOG=$(gh pr list --base staging --state merged --search "merged:>=$PREV_TAG_DATE" \
              --json number,title --jq '.[] | "- \(.title) (#\(.number))"' 2>/dev/null || echo "")
          fi

          # Fallback to git log if no PRs found
          if [ -z "$CHANGELOG" ]; then
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log "${PREV_TAG}..staging" --oneline --no-merges --pretty=format:"- %s" \
                | grep -v "^- chore(deploy):" | grep -v "^- chore(release):" || echo "- No changes")
            else
              CHANGELOG="- Initial release"
            fi
          fi

          PR_BODY="## Staging Release

          **Image tag:** \`$IMAGE_TAG\`
          **Deployed to:** staking-dev.pocket.network

          ### Changes since ${PREV_TAG:-v0.0.0}
          ${CHANGELOG}

          ---
          Add a \`release:patch\`, \`release:minor\`, or \`release:major\` label and merge to deploy to production.

          *Auto-generated by staging deploy workflow*"

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "Release: staging ($IMAGE_TAG)" \
              --body "$PR_BODY"
            echo "Updated existing PR #$EXISTING_PR"
          else
            gh pr create \
              --base main \
              --head release \
              --title "Release: staging ($IMAGE_TAG)" \
              --body "$PR_BODY"
            echo "Created new PR from release to main"
          fi
