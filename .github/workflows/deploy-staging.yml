name: Deploy Staging

on:
  pull_request:
    types: [closed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 18.20.3

      - run: pnpm install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Prune all apps
        run: |
          for APP in middleman middleman-workflows provider provider-workflows; do
            pnpm exec turbo prune @igniter/$APP --out-dir ./out/$APP --docker
          done

      - name: Build and push middleman
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/middleman/Dockerfile
          push: true
          tags: ghcr.io/pokt-network/middleman:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push middleman-workflows
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/middleman-workflows/Dockerfile
          push: true
          tags: ghcr.io/pokt-network/middleman-workflows:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push provider
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/provider/Dockerfile
          push: true
          tags: ghcr.io/pokt-network/provider:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push provider-workflows
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/provider-workflows/Dockerfile
          push: true
          tags: ghcr.io/pokt-network/provider-workflows:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update staging overlay
        run: |
          sed -i 's/newTag: ".*"/newTag: "'"$IMAGE_TAG"'"/' k8s/apps/middleman/overlays/staging/kustomization.yaml

      - name: Commit and push overlay changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/middleman/overlays/staging/kustomization.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(deploy): update staging image to $IMAGE_TAG"
          git push

      - name: Create or update release PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create/update release branch from staging
          git checkout -B release
          git push --force origin release

          # Check if a PR from release to main already exists
          EXISTING_PR=$(gh pr list --base main --head release --json number --jq '.[0].number' 2>/dev/null || echo "")

          PR_BODY="## Staging Release

          **Image tag:** \`$IMAGE_TAG\`
          **Deployed to:** staking-dev.pocket.network

          Add a \`release:patch\`, \`release:minor\`, or \`release:major\` label and merge to deploy to production.

          ---
          *Auto-generated by staging deploy workflow*"

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "Release: staging ($IMAGE_TAG)" \
              --body "$PR_BODY"
            echo "Updated existing PR #$EXISTING_PR"
          else
            gh pr create \
              --base main \
              --head release \
              --title "Release: staging ($IMAGE_TAG)" \
              --body "$PR_BODY"
            echo "Created new PR from release to main"
          fi
