name: Build Image

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application to build"
        required: true
        type: choice
        options:
          - middleman
          - middleman-workflows
          - provider
          - provider-workflows
      tag:
        description: "Image tag (e.g., dev-fix-auth, 0.7.0-rc1)"
        required: true
        type: string
      push:
        description: "Push to GHCR?"
        required: true
        type: boolean
        default: false
      no-cache:
        description: "Build without cache?"
        required: false
        type: boolean
        default: false

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 18.20.3

      - run: pnpm install --frozen-lockfile

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare docker context
        run: pnpm exec turbo prune @igniter/${{ inputs.app }} --out-dir ./out/${{ inputs.app }} --docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ inputs.app }}/Dockerfile
          push: ${{ inputs.push }}
          tags: ghcr.io/pokt-network/${{ inputs.app }}:${{ inputs.tag }}
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.no-cache && ' ' || 'type=gha' }}
          cache-to: type=gha,mode=max
