# EXAMPLE CONFIGURATION ONLY, provided "as is" without warranty.
# You are solely responsible for securing your own deployment.
# A real deployment runs either a provider or a middleman, not both.
# See docker-compose/README.md#security--usage-notice before using it with real keys or funds.
services:
  provider-migration:
    image: "ghcr.io/pokt-network/provider:${IGNITER_VERSION:?set IGNITER_VERSION in .env}"
    container_name: provider-migration
    restart: "no"
    command: [ "pnpm", "provider:migration:migrate" ]
    # Database only; no egress.
    networks:
      - backend
    env_file:
      - .env

  provider-web:
    image: "ghcr.io/pokt-network/provider:${IGNITER_VERSION:?set IGNITER_VERSION in .env}"
    container_name: provider-web
    networks:
      - backend
      - egress
    env_file:
      - .env
    depends_on:
      provider-migration:
        condition: service_completed_successfully
    # Bound to localhost — use a reverse proxy to expose only the API paths
    # listed in the README to the public network.
    ports:
      - "127.0.0.1:3001:3001"

  provider-workflows:
    image: "ghcr.io/pokt-network/provider-workflows:${IGNITER_VERSION:?set IGNITER_VERSION in .env}"
    container_name: provider-workflows
    networks:
      - backend
      - egress
    env_file:
      - .env
    depends_on:
      provider-migration:
        condition: service_completed_successfully

networks:
  # PostgreSQL and Temporal, reachable only through this provider-only network
  # (created by the dependencies stack; internal, no route out). The other app
  # stack is on a different network and cannot reach these containers.
  # IMPORTANT: start docker-compose.yaml in the 'dependencies' folder first.
  backend:
    name: igniter-provider
    external: true
  # This stack's own network for outbound traffic (chain RPC, governance CDN,
  # notifications) and for the published port. Nothing else joins it.
  egress:
    name: igniter-provider-egress
    driver_opts:
      # Fixed host bridge name, so host firewall rules can target this stack's
      # outbound traffic (see "Hardening" in docker-compose/README.md).
      com.docker.network.bridge.name: ign-pv-egress
