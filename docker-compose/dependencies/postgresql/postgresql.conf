# DB Version: 16
# OS Type: linux
# DB Type: web
# Total Memory (RAM): 16 GB
# CPUs num: 2
# Connections num: 200
# Data Storage: ssd
# Must stay '*': this file replaces the image's default config, whose
# listen_addresses default is 'localhost', and the apps and Temporal connect
# from other containers. Exposure is limited by the compose networks and the
# 127.0.0.1-only port publish, not here.
listen_addresses = '*'
max_connections = 200
shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 20164kB
huge_pages = off
min_wal_size = 1GB
max_wal_size = 4GB
