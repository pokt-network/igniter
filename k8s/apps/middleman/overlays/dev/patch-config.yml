apiVersion: v1
kind: ConfigMap
metadata:
  name: middleman-config
data:
  PROVIDERS_CDN_URL: "https://soothe-vault.nyc3.cdn.digitaloceanspaces.com/{chainId}/providers.json"
  AUTH_TRUST_HOST: "true"
  APP_URL: "http://localhost:3000"
  AUTH_URL: "http://localhost:3000"
  CHAIN_ID: "pocket"
  BLOCKCHAIN_PROTOCOL: "shannon"
  OWNER_IDENTITY: "CHANGE_THIS"
  OWNER_EMAIL: "CHANGE_THIS"
  TEMPORAL_URL: "temporal-frontend.default.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "middleman"
  TEMPORAL_TASK_QUEUE: "middleman-operations"
  MAINNET_INDEXER_API_URL: "https://indexer.pocket.network/"
  BETA_INDEXER_API_URL: "https://indexer.beta.pocket.network/"
  ALPHA_INDEXER_API_URL: "https://indexer.alpha.pocket.network/"
  MINIMUM_STAKE_BUFFER: "2000000"
