apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: middleman
  name: middleman-pocket-network
spec:
  rules:
    - host: staking.pocket.network
      http:
        paths:
          - backend:
              service:
                name: middleman
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - staking.pocket.network
      secretName: staking-pocket-tls
