apiVersion: v1
kind: ConfigMap
metadata:
  name: middleman-workflows-config
data:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
  TEMPORAL_URL: "REPLACE_IN_ENVIRONMENT"
  TEMPORAL_NAMESPACE: "REPLACE_IN_ENVIRONMENT"
  TEMPORAL_TASK_QUEUE: "REPLACE_IN_ENVIRONMENT"
  TEMPORAL_WORKFLOW_RETENTION: "REPLACE_IN_ENVIRONMENT"
  POKT_RPC_URL: "REPLACE_IN_ENVIRONMENT"
  # Schedule interval overrides (optional — defaults are in bootstrap.ts)
  # SCHEDULE_PROVIDER_STATUS_INTERVAL: "1m"
  # SCHEDULE_EXECUTE_PENDING_TX_INTERVAL: "10s"
  # SCHEDULE_SUPPLIER_STATUS_INTERVAL: "2m"
  # SCHEDULE_IMPORT_SUPPLIER_RECOVERY_INTERVAL: "1m"
